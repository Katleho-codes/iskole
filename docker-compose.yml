services:
  iskole-db:
    image: postgres:16-alpine
    container_name: iskole_db
    restart: unless-stopped
    env_file:
      - ./apps/api/.env
    environment:
      POSTGRES_DB: iskole
      POSTGRES_USER: iskole
      POSTGRES_PASSWORD: iskole
    volumes:
      - iskole_postgres:/var/lib/postgresql/data
    networks:
      - homelab
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U iskole"]
      interval: 5s
      timeout: 3s
      retries: 12

  iskole-api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: iskole_api
    restart: unless-stopped
    env_file:
      - ./.env
    depends_on:
      iskole-db:
        condition: service_healthy
    networks:
      - homelab

  iskole-web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    container_name: iskole_web
    restart: unless-stopped
    env_file:
      - ./.env
    environment:
      API_INTERNAL_URL: http://iskole-api:8004
      PORT: 3000
    depends_on:
      - iskole-api
    networks:
      - homelab

networks:
  homelab:
    driver: bridge

volumes:
  iskole_postgres:
