packages:
  - apps/*
  - packages/*

# Pin exact versions (OWASP: Vulnerable Dependency Management).
saveExact: true

# Security override. Prisma Studio (a dev-only transitive of prisma) still resolves
# lodash 4.17.x, which is affected by GHSA-r5fr-rjxr-66jc. Patch floor is 4.18.1.
overrides:
  lodash: ^4.18.1

# Dependencies that need their install script (esbuild for tsx/tsup). Reviewed list, not a blanket allow.
allowBuilds:
  esbuild: true
  prisma: true
  workerd: false
  "@prisma/engines": true
