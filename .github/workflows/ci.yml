name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NODE_VERSION: 24
  PNPM_VERSION: 12.14.0
  # Test-only credentials. They exist only inside the ephemeral Postgres service.
  TEST_DATABASE_URL: postgresql://iskole:iskole@localhost:5432/iskole_test?schema=public

jobs:
  verify:
    name: Lint, typecheck, test and build
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: iskole
          POSTGRES_PASSWORD: iskole
          POSTGRES_DB: iskole_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U iskole"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm --filter @iskole/api exec prisma generate

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build
        env:
          DATABASE_URL: ${{ env.TEST_DATABASE_URL }}
          BETTER_AUTH_URL: http://localhost:4010
          BETTER_AUTH_SECRET: ci-build-secret-ci-build-secret-1234
          SIGNING_SECRET: ci-signing-secret-ci-signing-32b
          ID_ENCRYPTION_KEY: dGVzdC1lbmNyeXB0aW9uLWtleS0zMi1ieXRlcyE
          APP_URL: http://localhost:3000
          API_INTERNAL_URL: http://localhost:4010

  dependency-audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Fail on high or critical advisories
        run: pnpm audit --audit-level=high
